name: "Feature Request"
description: "Suggest an idea or improvement for Trashbyrds UEFN Power Tools."
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! This project is **beta software**
        and still actively evolving.

        Please search [existing issues](../../issues) first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the problem or limitation you're running into.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: What would it look like?
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Alternatives considered, related context, mockups, etc.
    validations:
      required: false
