name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi

      - name: Assemble release archive
        shell: bash
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          rm -rf release
          mkdir -p release/staging

          cp uefn-server.mjs release/staging/
          cp -r python release/staging/python
          cp -r skills release/staging/skills
          cp LICENSE release/staging/LICENSE
          cp README.md release/staging/README.md
          cp INSTALL.md release/staging/INSTALL.md
          cp package.json release/staging/package.json

          find release/staging -type d -name "__pycache__" -exec rm -rf {} +
          find release/staging -type f -name "*.pyc" -delete

          cd release/staging
          zip -r "../trashbyrds-power-tools-${VERSION}.zip" .
          cd ../..

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/trashbyrds-power-tools-${{ env.VERSION }}.zip
            uefn-server.mjs
