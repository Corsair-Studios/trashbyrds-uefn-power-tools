name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi

      # python/bridge_version.py carries the stamp init_unreal.py's bridge
      # self-sync compares to decide whether to copy newer tools over older
      # ones. If it drifts from package.json that comparison is meaningless
      # and the sync silently makes wrong decisions. It drifted to 0.1.1
      # against a 0.1.4 package precisely because nothing checked it, so
      # check it here rather than trusting a hand edit at bump time.
      - name: Verify bridge_version.py matches package.json version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          STAMP=$(sed -n 's/^BRIDGE_VERSION *= *"\([^"]*\)".*/\1/p' python/bridge_version.py)
          if [ -z "$STAMP" ]; then
            echo "Could not read BRIDGE_VERSION from python/bridge_version.py"
            exit 1
          fi
          if [ "$STAMP" != "$PKG" ]; then
            echo "python/bridge_version.py BRIDGE_VERSION ($STAMP) does not match package.json version ($PKG)."
            echo "Update BRIDGE_VERSION to $PKG and commit it as part of the version bump."
            exit 1
          fi
          echo "BRIDGE_VERSION $STAMP matches package.json"

      - name: Assemble release archive
        shell: bash
        run: |
          if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          rm -rf release
          mkdir -p release/staging

          cp uefn-server.mjs release/staging/
          cp -r python release/staging/python
          cp -r skills release/staging/skills
          cp LICENSE release/staging/LICENSE
          cp README.md release/staging/README.md
          cp INSTALL.md release/staging/INSTALL.md
          cp package.json release/staging/package.json

          find release/staging -type d -name "__pycache__" -exec rm -rf {} +
          find release/staging -type f -name "*.pyc" -delete

          cd release/staging
          zip -r "../trashbyrds-power-tools-${VERSION}.zip" .
          cd ../..

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/trashbyrds-power-tools-${{ env.VERSION }}.zip
            uefn-server.mjs
